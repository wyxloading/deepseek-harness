# Proactive compaction with a bounded message budget.

- id: agent-instructions
  disabled: true

- id: llm-deepseek
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 8820 # 8,622 + the longer system prompt; see cordis.snapshot.yml
        maxTokens: 1000

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20

- insert:
    - id: compaction-working-directory
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/compaction-working-directory.ts'
